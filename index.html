    // 近10期趋势面积折线图组件（支持16项中美宏观指标、4项跨资产锚、6大宗商品期现价格）
    function TrendChart10D({ data, dates = [], unit = "", color = "#10B981", label = "近10日趋势", height = 56 }) {
      const series = Array.isArray(data) && data.length >= 2 ? data.map(Number) : null;
      if (!series) return null;
      const min = Math.min(...series);
      const max = Math.max(...series);
      const range = max - min || 1;
      const width = 280;
      const padX = 8;
      const padY = 10;
      const innerW = width - padX * 2;
      const innerH = height - padY * 2;

      const coords = series.map((val, idx) => {
        const x = padX + (idx / (series.length - 1)) * innerW;
        const y = padY + innerH - ((val - min) / range) * innerH;
        return { x, y, val, date: dates[idx] || `T-${series.length - 1 - idx}` };
      });

      const polylinePoints = coords.map(pt => `${pt.x.toFixed(1)},${pt.y.toFixed(1)}`).join(" ");
      const areaPoints = `${coords[0].x.toFixed(1)},${height - 2} ${polylinePoints} ${coords[coords.length - 1].x.toFixed(1)},${height - 2}`;
      const first = coords[0];
      const last = coords[coords.length - 1];
      const delta = +(last.val - first.val).toFixed(2);
      const deltaStr = `${delta >= 0 ? "+" : ""}${delta}${unit}`;

      return (
        <div className="mt-2.5 pt-2 border-t border-slate-800/70">
          <div className="flex items-center justify-between text-[11px] text-slate-400 mb-1 font-mono">
            <span>{label} ({first.date} ➔ {last.date})</span>
            <span>
              {first.val}{unit} ➔ <strong className="text-white">{last.val}{unit}</strong> ({deltaStr})
            </span>
          </div>
          <svg viewBox={`0 0 ${width} ${height}`} className="w-full overflow-visible" style={{ height: `${height}px` }}>
            <polygon points={areaPoints} fill={color} fillOpacity="0.13" />
            <line
              x1={padX}
              y1={first.y.toFixed(1)}
              x2={width - padX}
              y2={first.y.toFixed(1)}
              stroke={color}
              strokeOpacity="0.3"
              strokeDasharray="3 3"
              strokeWidth="1"
            />
            <polyline
              fill="none"
              stroke={color}
              strokeWidth="2.2"
              strokeLinecap="round"
              strokeLinejoin="round"
              points={polylinePoints}
            />
            {coords.map((pt, idx) => (
              <g key={idx}>
                <circle
                  cx={pt.x.toFixed(1)}

                  r={idx === coords.length - 1 ? "3.6" : idx === 0 ? "2.6" : "1.8"}

                  strokeWidth={idx === coords.length - 1 ? "2" : "1"}
                >

              </g>
            ))}
          </svg>
          <div className="flex items-center justify-between text-[11px] text-slate-500 font-mono">

            <span>10期最高: {max}{unit}</span>
          </div>
        </div>
      );

    // 分品类大宗期现、仓单与产业链利润传导评级引擎（含逾期缓存/无日频源自动降级锁，前后端100%同构）
    function evaluateCommodityGradeJS(item, dfii10 = 2.60) {
      const cid = item.id || "";
      const sector = item.sector || "";
      const basis = Number(item.basis || 0);
      const basisPct = Number(item.basisPct || 0);
      const invPct = Number(item.invPercentile ?? 50);
      const dataStatus = item.data_status || "updated";
      const obsDate = item.futuresObsDate || item.spotObsDate || "历史缓存";

      if (dataStatus === "cached" || cid === "tungsten") {
        return {
          grade: "CACHE_WATCH",
          label: `长单观察 (${obsDate})`,
          badgeColor: "slate",
          allowOffense: false,
          pseudoDividendWarning: false,
          summary: `该品种无交易所日频公开行情刷新路径（当前沿用 ${obsDate} 数据）。按数据校准纪律，未取得新一期原始长单前暂停强共振评级，仅作观察。`
        };
      }

      if (cid === "gold" || sector === "贵金属") {
        if (dfii10 >= 2.30) {
          return {
            grade: "PRECIOUS_HEDGE",
            label: "央行购金底仓 · 实际利率约束",
            badgeColor: "amber",
            allowOffense: true,
            pseudoDividendWarning: false,
            summary: `10Y TIPS实际利率(${dfii10.toFixed(2)}%)处高位对金价构成短线分母约束，上金所Au99.99(${item.spotPrice}元/克)与央行购金封锁中期下行空间，宜待实际利率回落分批配置。`
          };
        }
        return {
          grade: "STRONG_BULL",
          label: "实际利率回落 · 黄金主升共振",
          badgeColor: "emerald",
          allowOffense: true,
          pseudoDividendWarning: false,
          summary: `10Y TIPS实际利率(${dfii10.toFixed(2)}%)温和回落叠加央行购金与上金所Au99.99实金买盘支撑，贵金属迎来分母端双击。`
        };
      }

      if (cid === "alumina") {
        const alChg = Number(item.alChangePct ?? -1.66);
        const aoChg = Number(item.changePct ?? 0.04);
        if (alChg < 0 && aoChg >= alChg) {
          return {
            grade: "BACK_WATCH",
            label: "仓单去化 · 吨铝利润待确认",
            badgeColor: "amber",
            allowOffense: true,
            pseudoDividendWarning: false,
            summary: `上期所氧化铝(2023.06上市以来3.4年分位 ${invPct}%)与沪铝仓单同步去化，近月维持期货Back(+${basisPct}%)；但当日沪铝(${alChg}%)弱于氧化铝(+${aoChg}%)，对需外购氧化铝的电解铝企(如云铝)形成成本端扰动，吨铝利润方向待确认。`
          };
        }
      }

      if (invPct < 25.0 && basis > 0) {
        return {
          grade: "STRONG_BULL",
          label: "仓单去化+期货Back 强共振",
          badgeColor: "emerald",
          allowOffense: true,
          pseudoDividendWarning: false,
          summary: `交易所注册仓单处 ${invPct}% 低分位（${item.invWindowLabel || "近5年"}），且近月较主力合约升水 +${basisPct}%（期货月差Back），供需紧平衡支撑上游高自给率矿端龙头。`
        };
      }

      if (basis < 0 && invPct >= 35.0) {
        return {
          grade: "CONTANGO_BEAR",
          label: "现货偏弱+高库存 · 伪红利排雷",
          badgeColor: "rose",
          allowOffense: false,
          pseudoDividendWarning: true,
          summary: `旬度现货较期货贴水 ${basisPct}% 且库存分位达 ${invPct}%，反映施工淡季需求偏弱，严禁因静态高股息率将其作为红利底仓。`
        };
      }

      if (basis > 0) {
        return {
          grade: "BACK_WATCH",
          label: "期货近月Back · 结构支撑",
          badgeColor: "sky",
          allowOffense: true,
          pseudoDividendWarning: false,
          summary: `期货近月保持升水 +${basisPct}%（月差Back），库存分位 ${invPct}%（${item.invWindowLabel || ""}）处于可控区间，具备逢低配置价值。`
        };
      }

      return {
        grade: "NEUTRAL",
        label: "期现均衡观察",
        badgeColor: "slate",
        allowOffense: false,
        pseudoDividendWarning: false,
        summary: `库存分位 ${invPct}% / 价差 ${basisPct}%，等待仓单去化斜率或期现结构进一步明朗。`
      };
    }

                      { name: "巨潮资讯网 (A股官方披露)", desc: "检索《投资者关系活动记录表》、小批量定点通知书、矿山配额/环评与股东减持公告", url: "http://www.cninfo.com.cn/" }
                    ].map((s, i) => (
                      <a
                        key={i}
                        href={s.url}
                        target="_blank"
                        rel="noreferrer"
                        className="block bg-slate-900/75 hover:bg-slate-800/80 p-3.5 rounded-xl border border-slate-800 transition"
                      >
                        <div className="flex items-center justify-between">
                          <span className="text-xs md:text-sm font-bold text-white">{s.name}</span>
                          <span className="text-xs text-indigo-400 shrink-0">直达 ↗</span>
                        </div>
                        <p className="text-xs text-slate-400 mt-1.5 leading-relaxed">{s.desc}</p>
                      </a>
                    ))}
                  </div>
                </div>
              </div>
            )}
          </main>

          {/* 移动端底部固定毛玻璃导航栏 */}
          <nav className="md:hidden fixed bottom-0 left-0 right-0 z-40 glass-card border-t border-slate-800 px-1.5 py-1">
            <div className={`grid ${VISIBLE_PAGES.length === 4 ? "grid-cols-4" : "grid-cols-6"} gap-1`}>
              {VISIBLE_PAGES.map(p => (
                <button
                  key={p.id}
                  onClick={() => setActivePage(p.id)}
                  className={`mobile-nav-btn rounded-lg font-semibold text-center transition truncate ${
                    activePage === p.id
                      ? "bg-indigo-600 text-white shadow"
                      : "text-slate-400"
                  }`}
                >
                  {p.short}
                </button>
              ))}
            </div>
          </nav>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
</body>
</html>
