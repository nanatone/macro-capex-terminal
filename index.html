": ["【纯固收客户安抚话术】：“当前央行呵护流动性态度明确（DR007低位运行），近期净值小幅波动主要是长端国债在历史低利率区间的正常呼吸。我们产品以中短久期高等级信用债筑底，吃稳健票息，不建议在波动中频繁赎回损失复利。”", "【分行RM配置转化建议】：针对风险偏好适中的存量到期客户，主推“短债底仓 + 央企红利/硬科技固收+”哑铃型组合，既锁定当前稀缺的稳健票息，又保留AI产业周期与宽信用修复的向上期权。", "【预警阈值跟踪】：持续监控10Y国债2.25%与DR007 1.90%两条风控线，未触及前维持存续产品“持仓待涨”评级。"]}}}, "capex_tracker": [{"stage": "第一阶段：算力与硬件基建 (先导指标)", "status": "高景气兑现期", "badge_color": "emerald", "chain_nodes": "台积电CoWoS先进封装 ➔ HBM3e/HBM4存储 ➔ 800G/1.6T光模块 ➔ AIDC液冷与电力设备", "sec_cninfo_keywords": ["Purchases of property and equipment", "CoWoS capacity allocation", "800G/1.6T transceivers", "Liquid cooling", "合同负债", "在建工程"], "verification_metric": "北美四大云厂商(MSFT/GOOG/META/AMZN)季度CapEx同比增速 > 35%，且台积电法说会维持AI营收CAGR指引。", "red_flag": "云厂商下调下季度CapEx指引，或光模块/服务器ODM厂商存货周转天数连续两个季度异常攀升。"}, {"stage": "第二阶段：模型架构与Agent商业化 (中期演进)", "status": "分化验证期", "badge_color": "blue", "chain_nodes": "Reasoning推理期扩展 ➔ 端侧轻量化模型 ➔ 企业级AI Agent工作流 ➔ 垂直行业SaaS增收", "sec_cninfo_keywords": ["Remaining Performance Obligations (RPO)", "AI Copilot seat adoption", "Inference token volume", "ARR增速", "研发费用资本化率"], "verification_metric": "软件企业RPO（剩余履约义务）增速连续超越营收增速，AI附加功能带来ARPU值实质提升 > 15%。", "red_flag": "空有Token调用量暴增但客户留存率低，毛利率因算力租赁成本过高而持续恶化。"}, {"stage": "第三阶段：具身智能与人形机器人 (长周期空间)", "status": "0到1定点突破期", "badge_color": "purple", "chain_nodes": "多模态端到端控制算法 ➔ 行星滚柱丝杠 ➔ 谐波减速器 ➔ 六维力传感器与空心杯电机", "sec_cninfo_keywords": ["行星滚柱丝杠", "六维力传感器", "客户送样验证", "小批量定点通知书", "投资者关系活动记录表"], "verification_metric": "头部主机厂进入千台级产线实训，国内核心零部件厂商在巨潮资讯网披露正式定点公告与专用产线环评。", "red_flag": "仅停留在框架战略合作协议、无实质研发设备投入、主业现金流恶化且大股东高位减持。"}]};

    function App() {
      const [rawData, setRawData] = useState(FALLBACK_DATA);
      const [activePage, setActivePage] = useState(0); // 0..4 五页滑动视图
      const [reportMode, setReportMode] = useState("trading"); // "trading" | "wealth"
      const [simMode, setSimMode] = useState(false);
      const [copiedText, setCopiedText] = useState("");

      // 实时沙盘模拟参数
      const [simUs10y, setSimUs10y] = useState(4.28);
      const [simUs10y5d, setSimUs10y5d] = useState(14.0);
      const [simCn10y, setSimCn10y] = useState(2.11);
      const [simDr007, setSimDr007] = useState(1.62);
      const [simScissors, setSimScissors] = useState(-6.8);
      const [simErp, setSimErp] = useState(6.15);

      // 移动端触摸滑动监听
      const touchStartX = useRef(null);
      const touchEndX = useRef(null);

      const PAGES = [
        { id: 0, short: "① 双层决策", title: "硬逻辑阈值 + AI双视角早报" },
        { id: 1, short: "② 宏观脉冲", title: "中美一手指标与3年分位数" },
        { id: 2, short: "③ 科技CapEx", title: "全球AI算力/Agent/具身智能验证" },
        { id: 3, short: "④ 哑铃沙盘", title: "动态攻防配比与实时压力测试" },
        { id: 4, short: "⑤ 权威信源", title: "一手监管披露直达与核查SOP" }
      ];

      // 加载云端由 GitHub Actions 每日更新的 ./data/macro_daily.json
      useEffect(() => {
        fetch("./data/macro_daily.json?t=" + new Date().getTime())
          .then(res => {
            if (!res.ok) throw new Error("Fallback to embedded data");
            return res.json();
          })
          .then(json => {
            setRawData(json);
            setSimUs10y(json.metrics.us.dgs10.value);
            setSimUs10y5d(json.metrics.us.dgs10.chg_5d_bp);
            setSimCn10y(json.metrics.cn.cn10y.value);
            setSimDr007(json.metrics.cn.dr007.value);
            setSimScissors(json.metrics.cn.m1_m2_diff.value);
            setSimErp(json.metrics.cn.erp_csi300.value);
          })
          .catch(() => {
            console.log("Using built-in baseline macro data.");
          });
      }, []);

      // 键盘左右方向键翻页支持
      useEffect(() => {
        const handleKeyDown = (e) => {
          if (e.key === "ArrowRight") setActivePage(p => Math.min(4, p + 1));
          if (e.key === "ArrowLeft") setActivePage(p => Math.max(0, p - 1));
        };
        window.addEventListener("keydown", handleKeyDown);
        return () => window.removeEventListener("keydown", handleKeyDown);
      }, []);

      const onTouchStart = (e) => {
        touchStartX.current = e.targetTouches[0].clientX;
      };
      const onTouchMove = (e) => {
        touchEndX.current = e.targetTouches[0].clientX;
      };
      const onTouchEnd = () => {
        if (!touchStartX.current || !touchEndX.current) return;
        const distance = touchStartX.current - touchEndX.current;
        if (distance > 65) setActivePage(p => Math.min(4, p + 1));
        if (distance < -65) setActivePage(p => Math.max(0, p - 1));
        touchStartX.current = null;
        touchEndX.current = null;
      };

      // 前端实时双层决策重算引擎（当开启沙盘推演 simMode 时动态重算所有硬规则、哑铃配比和软研报）
      const computedEngine = useMemo(() => {
        if (!simMode) return rawData.decision_engine;

        let defense = 50;
        const rules = [];

        if (simUs10y >= 4.35 || simUs10y5d >= 12) {
          defense += 8;
          rules.push({
            id: "RULE_US_RATE_SLOPE",
            dimension: "海外分母端斜率预警 (沙盘推演)",
            status: "warning",
            status_label: "斜率承压",
            trigger_condition: "10Y美债 > 4.35% 或 5日上行 > 12bp",
            current_reading: `${simUs10y.toFixed(2)}% (5日 ${simUs10y5d >= 0 ? "+" : ""}${simUs10y5d}bp)`,
            action_instruction: "美债分母端贴现率上冲过快，压制远期现金流占比高的高估值科技概念，海外久期宜缩短。"
          });
        } else if (simUs10y <= 3.90) {
          defense -= 8;
          rules.push({
            id: "RULE_US_RATE_SLOPE",
            dimension: "海外分母端斜率预警 (沙盘推演)",
            status: "bullish",
