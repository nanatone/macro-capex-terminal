                      <span className="text-slate-300 font-semibold">② 10Y TIPS 实际利率 (DFII10)</span>
                      <span className="font-mono text-sky-400 font-bold">{simDfii10.toFixed(2)}%</span>
                    </div>
                    <input
                      type="range" min="1.00" max="3.20" step="0.05"
                      value={simDfii10}
                      onChange={(e) => { setSimMode(true); setSimDfii10(parseFloat(e.target.value)); }}
                      className="w-full accent-indigo-500"
                    />
                    <div className="flex justify-between text-[11px] text-slate-500 mt-1">
                      <span>1.00% (低实际利率)</span>
                      <span>预警 2.20%</span>
                      <span>3.20% (严厉压制)</span>
                    </div>
                  </div>

                  {/* 3. 10Y美债5日动量斜率 */}
                  <div className="bg-slate-900/80 p-4 rounded-xl border border-slate-800">
                    <div className="flex justify-between text-xs mb-2">
                      <span className="text-slate-300 font-semibold">③ 10Y 美债 5日斜率 (bps)</span>
                      <span className="font-mono text-sky-400 font-bold">{simUs10y5d > 0 ? `+${simUs10y5d}` : simUs10y5d} bp</span>
                    </div>
                    <input
                      type="range" min="-30" max="40" step="2"
                      value={simUs10y5d}
                      onChange={(e) => { setSimMode(true); setSimUs10y5d(parseFloat(e.target.value)); }}
                      className="w-full accent-indigo-500"
                    />
                    <div className="flex justify-between text-[11px] text-slate-500 mt-1">
                      <span>-30bp (急跌)</span>
                      <span>预警 +12bp</span>
                      <span>+40bp (急升)</span>
                    </div>
                  </div>

                  {/* 4. 美联储商业银行准备金 */}
                  <div className="bg-slate-900/80 p-4 rounded-xl border border-slate-800">
                    <div className="flex justify-between text-xs mb-2">
                      <span className="text-slate-300 font-semibold">④ 美联储银行准备金 (WRESBAL)</span>
                      <span className="font-mono text-sky-400 font-bold">{simWresbal.toFixed(0)}B</span>
                    </div>
                    <input
                      type="range" min="2500" max="3800" step="25"
                      value={simWresbal}
                      onChange={(e) => { setSimMode(true); setSimWresbal(parseFloat(e.target.value)); }}
                      className="w-full accent-indigo-500"
                    />
                    <div className="flex justify-between text-[11px] text-slate-500 mt-1">
                      <span>2500B (钱荒危机)</span>
                      <span>底线 3000B</span>
                      <span>3800B (充裕)</span>
                    </div>
                  </div>

                  {/* 5. 10Y 中债国债收益率 (量程已下探至1.20%) */}
                  <div className="bg-slate-900/80 p-4 rounded-xl border border-slate-800">
                    <div className="flex justify-between text-xs mb-2">
                      <span className="text-slate-300 font-semibold">⑤ 10Y 中债国债收益率 (CN10Y)</span>
                      <span className="font-mono text-emerald-400 font-bold">{simCn10y.toFixed(2)}%</span>
                    </div>
                    <input
                      type="range" min="1.20" max="2.60" step="0.02"
                      value={simCn10y}
                      onChange={(e) => { setSimMode(true); setSimCn10y(parseFloat(e.target.value)); }}
                      className="w-full accent-emerald-500"
                    />
                    <div className="flex justify-between text-[11px] text-slate-500 mt-1">
                      <span>1.20% (极度资产荒)</span>
                      <span>阈值 2.18%</span>
                      <span>2.60% (复苏)</span>
                    </div>
                  </div>

                  {/* 6. 银行间 FDR007(DR007) 资金利率 */}
                  <div className="bg-slate-900/80 p-4 rounded-xl border border-slate-800">
                    <div className="flex justify-between text-xs mb-2">
                      <span className="text-slate-300 font-semibold">⑥ 银行间 FDR007(DR007) 利率</span>
                      <span className="font-mono text-emerald-400 font-bold">{simDr007.toFixed(2)}%</span>
                    </div>
                    <input
                      type="range" min="1.10" max="2.30" step="0.05"
                      value={simDr007}
                      onChange={(e) => { setSimMode(true); setSimDr007(parseFloat(e.target.value)); }}
                      className="w-full accent-emerald-500"
                    />
                    <div className="flex justify-between text-[11px] text-slate-500 mt-1">
                      <span>1.10% (宽货币)</span>
                      <span>1.80%</span>
                      <span>2.30% (资金紧)</span>
                    </div>
                  </div>

                  {/* 7. R007-DR007 流动性分层利差 */}
                  <div className="bg-slate-900/80 p-4 rounded-xl border border-slate-800">
                    <div className="flex justify-between text-xs mb-2">
                      <span className="text-slate-300 font-semibold">⑦ R007-DR007 非银分层利差</span>
                      <span className={`font-mono font-bold ${simRDrSpread >= 25 ? "text-rose-400" : "text-emerald-400"}`}>
                        {simRDrSpread.toFixed(1)} bp
                      </span>
                    </div>
                    <input
                      type="range" min="-5" max="50" step="1"
                      value={simRDrSpread}
                      onChange={(e) => { setSimMode(true); setSimRDrSpread(parseFloat(e.target.value)); }}
                      className="w-full accent-rose-500"
                    />
                    <div className="flex justify-between text-[11px] text-slate-500 mt-1">
                      <span>0bp (平稳)</span>
                      <span>赎回预警 25bp</span>
                      <span>50bp (理财踩踏)</span>
                    </div>
                  </div>

                  {/* 8. 中国 M1-M2 同比剪刀差 */}
                  <div className="bg-slate-900/80 p-4 rounded-xl border border-slate-800">
                    <div className="flex justify-between text-xs mb-2">
                      <span className="text-slate-300 font-semibold">⑧ 中国 M1-M2 同比剪刀差</span>
                      <span className="font-mono text-purple-400 font-bold">{simScissors.toFixed(1)}%</span>
                    </div>
                    <input
                      type="range" min="-10.0" max="2.0" step="0.2"
                      value={simScissors}
                      onChange={(e) => { setSimMode(true); setSimScissors(parseFloat(e.target.value)); }}
                      className="w-full accent-purple-500"
                    />
                    <div className="flex justify-between text-[11px] text-slate-500 mt-1">
                      <span>-10% (防御)</span>
                      <span>拐点 -3.5%</span>
                      <span>+2% (顺周期牛)</span>
                    </div>
                  </div>

                  {/* 9. 沪深300 股债风险溢价 (ERP) */}
                  <div className="bg-slate-900/80 p-4 rounded-xl border border-slate-800">
                    <div className="flex justify-between text-xs mb-2">
                      <span className="text-slate-300 font-semibold">⑨ 沪深300 股债风险溢价 (ERP)</span>
                      <span className="font-mono text-amber-400 font-bold">{simErp.toFixed(2)}%</span>
                    </div>
                    <input
                      type="range" min="4.00" max="7.20" step="0.05"
                      value={simErp}
                      onChange={(e) => { setSimMode(true); setSimErp(parseFloat(e.target.value)); }}
                      className="w-full accent-amber-500"
                    />
                    <div className="flex justify-between text-[11px] text-slate-500 mt-1">
                      <span>4.0% (偏贵)</span>
                      <span>高赔率 5.8%</span>
                      <span>7.2% (黄金坑)</span>
                    </div>
                  </div>
                </div>

                {/* 沙盘实时结论预览 */}
                <div className="bg-indigo-950/30 border border-indigo-500/30 rounded-xl p-4 flex flex-col md:flex-row items-start md:items-center justify-between gap-4">
                  <div>
                    <div className="text-xs text-indigo-300 font-semibold">沙盘推导结论预览（支持切换交易版/渠道版视角）：</div>
                    <div className="text-sm font-bold text-white mt-1">{activeReport.title}</div>
                    <div className="text-xs text-slate-300 mt-1">{activeReport.action_instructions[0]}</div>
                  </div>
                  <button
                    onClick={() => setActivePage(0)}
                    className="px-4 py-2 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-xs font-bold text-white shrink-0"
                  >
                    返回第①页查看完整报告与7维规则
                  </button>
                </div>
              </div>
            )}

            {/* ==================== PAGE 4: 股债传导百科、六大误区纠偏与一手权威信源 ==================== */}
            {activePage === 4 && (
              <div className="space-y-6">
                {/* 模块1：全球宏观政策与股债资产表现传导对照矩阵 */}
                <div className="glass-card rounded-2xl p-5">
                  <span className="text-xs font-bold text-indigo-400 uppercase">Macro-to-Asset Transmission Matrix</span>
                  <h3 className="text-base md:text-lg font-bold text-white mt-0.5 mb-3">
                    全球宏观政策情景与股债资产定价传导对照表（DCF 分子/分母 + 机构行为）
                  </h3>
                  <div className="overflow-x-auto">
                    <table className="w-full text-left border-collapse text-xs">
                      <thead>
                        <tr className="border-b border-slate-800 text-slate-400 bg-slate-900/70">
                          <th className="p-3 font-semibold">宏观政策与流动性情景</th>
                          <th className="p-3 font-semibold">核心一手驱动变量</th>
                          <th className="p-3 font-semibold">国债 / 利率债表现</th>
                          <th className="p-3 font-semibold">信用债 / 银行二永债表现</th>
                          <th className="p-3 font-semibold">股票市场风格分化</th>
                        </tr>
                      </thead>
                      <tbody className="divide-y divide-slate-800/70 text-slate-300">
                        {MACRO_SCENARIO_MATRIX.map((row, rIdx) => (
                          <tr key={rIdx} className="hover:bg-slate-900/40">
                            <td className="p-3 font-bold text-white">{row.scenario}</td>
                            <td className="p-3 text-sky-300 font-mono">{row.driver}</td>
                            <td className="p-3">{row.rateBond}</td>
                            <td className="p-3">{row.creditBond}</td>
                            <td className="p-3 text-emerald-300">{row.equity}</td>
                          </tr>
                        ))}
                      </tbody>
                    </table>
                  </div>
                </div>

                {/* 模块2：六大常见投研认知局限与实战纠偏 */}
                <div className="glass-card rounded-2xl p-5">
                  <span className="text-xs font-bold text-amber-400 uppercase">Institutional Reality Check · 6 Core Pitfalls</span>
                  <h3 className="text-base md:text-lg font-bold text-white mt-0.5 mb-3">
                    摆脱“看对新闻却亏钱”：二级实战与理财渠道必须规避的六大线性传导误区
                  </h3>
                  <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                    {SIX_PITFALL_GUIDES.map((item, idx) => (
                      <div key={idx} className="bg-slate-900/80 rounded-xl p-4 border border-slate-800 flex flex-col justify-between">
                        <div>
                          <div className="text-sm font-bold text-amber-300 mb-2">{item.title}</div>
                          <p className="text-xs text-slate-300 leading-relaxed mb-3">{item.truth}</p>
                        </div>
                        <div className="text-[11px] font-mono text-indigo-300 bg-indigo-950/40 px-2.5 py-1.5 rounded-lg border border-indigo-500/20">
                          {item.metric}
                        </div>
                      </div>
                    ))}
                  </div>
                </div>

                {/* 模块3：一手权威信源直达 */}
                <div className="glass-card rounded-2xl p-5">
                  <span className="text-xs font-bold text-sky-400 uppercase">First-Hand Regulatory & High-Frequency Sources</span>
                  <h3 className="text-base md:text-lg font-bold text-white mt-0.5 mb-4">全球一手监管披露与高频产业数据库直达 SOP</h3>
                  <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-3">
                    {[
                      { name: "FRED 美联储经济数据库", desc: "核查 DGS10、DFII10(实际利率)、T10YIE、WRESBAL(银行准备金)、WTREGEN(TGA)", url: "https://fred.stlouisfed.org/" },
                      { name: "美国财政部季度再融资 (QRA)", desc: "核查每季10Y/30Y长端美债净发行规模与期限溢价冲击", url: "https://home.treasury.gov/policy-issues/financing-the-government/quarterly-refunding" },
                      { name: "中国外汇交易中心 (ChinaMoney)", desc: "每日直查 FDR007(银银间定盘) 与 FR007(全市场定盘) 利差，监控理财赎回负反馈", url: "https://www.chinamoney.com.cn/chinese/bkfrr/" },
                      { name: "中国人民银行调查统计司", desc: "每月10-15日获取一手社融细分、M1/M2同比及货币政策执行报告", url: "http://www.pbc.gov.cn/diaochatongjisi/116219/index.html" },
                      { name: "中债信息网收益率曲线", desc: "查阅中债10Y/30Y国债、国开债及商业银行二永债到期收益率曲线", url: "https://yield.chinabond.com.cn/" },
                      { name: "台积电 (TSMC) 月度营收披露", desc: "每月10日公布上月合并营收，全球AI算力硬件最准的高频先导指标", url: "https://investor.tsmc.com/chinese/monthly-revenue" },
                      { name: "SEC EDGAR 美股财报与13F检索", desc: "查阅微软/谷歌/Meta/亚马逊 10-Q/10-K 资本开支指引、RPO与13F机构持仓", url: "https://www.sec.gov/edgar/searchedgar/companysearch" },
                      { name: "巨潮资讯网 (A股官方披露)", desc: "检索《投资者关系活动记录表》、小批量定点通知书、产线环评与股东减持公告", url: "http://www.cninfo.com.cn/" }
                    ].map((s, i) => (
                      <a
                        key={i}
                        href={s.url}
                        target="_blank"
                        rel="noreferrer"
                        className="block bg-slate-900/75 hover:bg-slate-800/80 p-3.5 rounded-xl border border-slate-800 transition"
                      >
                        <div className="flex items-center justify-between">
                          <span className="text-xs md:text-sm font-bold text-white">{s.name}</span>
                          <span className="text-xs text-indigo-400 shrink-0">直达 ↗</span>
                        </div>
                        <p className="text-xs text-slate-400 mt-1.5 leading-relaxed">{s.desc}</p>
                      </a>
                    ))}
                  </div>
                </div>
              </div>
            )}
          </main>

          {/* 移动端底部固定毛玻璃导航栏 */}
          <nav className="md:hidden fixed bottom-0 left-0 right-0 z-40 glass-card border-t border-slate-800 px-2 py-2">
            <div className="grid grid-cols-5 gap-1">
              {PAGES.map(p => (
                <button
                  key={p.id}
                  onClick={() => setActivePage(p.id)}
                  className={`py-2 rounded-xl text-[11px] font-semibold text-center transition ${
                    activePage === p.id
                      ? "bg-indigo-600 text-white shadow"
                      : "text-slate-400"
                  }`}
                >
                  {p.short}
                </button>
              ))}
            </div>
          </nav>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
</body>
</html>
